---
- name: Install and configure Tailscale
  block:
    - name: Add Tailscale apt signing key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Add Tailscale apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} main"
        filename: tailscale
        state: present

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Enable IP forwarding for subnet routing
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/99-tailscale.conf
        reload: true
      loop:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding

    - name: Get Tailscale status
      ansible.builtin.command: tailscale status --json
      register: tailscale_status
      changed_when: false
      failed_when: false

    - name: Read Tailscale backend state
      ansible.builtin.set_fact:
        tailscale_backend_state: "{{ (tailscale_status.stdout | default('{}', true) | from_json).BackendState | default('') }}"

    - name: Log in to the tailnet with the pre-auth key
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - "--auth-key={{ tailscale_authkey }}"
          - "--hostname={{ tailscale_hostname }}"
          - "--advertise-routes={{ tailscale_advertise_routes | join(',') }}"
          - "--accept-dns={{ tailscale_accept_dns | string | lower }}"
      no_log: true
      when:
        - tailscale_authkey | length > 0
        - tailscale_backend_state != 'Running'

    - name: Keep Tailscale settings in sync
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - "--hostname={{ tailscale_hostname }}"
          - "--advertise-routes={{ tailscale_advertise_routes | join(',') }}"
          - "--accept-dns={{ tailscale_accept_dns | string | lower }}"
      changed_when: false
      when: tailscale_backend_state == 'Running'

    - name: Show how to log in
      ansible.builtin.debug:
        msg: >-
          Tailscale is installed but not logged in. Run once:
          sudo tailscale up --hostname={{ tailscale_hostname }}
          --advertise-routes={{ tailscale_advertise_routes | join(',') }}
          --accept-dns={{ tailscale_accept_dns | string | lower }}
      when:
        - tailscale_authkey | length == 0
        - tailscale_backend_state != 'Running'
  when: tailscale_enabled is true
