---
seerr_enabled: false
seerr_available_externally: false

# Seerr (successor of Overseerr and Jellyseerr): media requests for Plex, Sonarr and Radarr
seerr_data_directory: "{{ docker_home }}/seerr"
seerr_hostname: "seerr"
seerr_port: "5055"

# docker
seerr_container_name: "seerr"
seerr_image_name: "ghcr.io/seerr-team/seerr"
seerr_image_version: "v3.5.2"
seerr_log_level: "info"

# The image runs as the node user (UID/GID 1000)
seerr_user_id: "1000"
seerr_group_id: "1000"

# specs
seerr_memory: 1g
